name: lendwell
version: "1.0.0"
config-version: 2

profile: lendwell

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

# The book is observed as at a single reporting date. All DPD/PAR maths is
# relative to this date. Centralized here (not hardcoded per-model) so a
# future reporting cycle is a one-line change.
vars:
  as_of_date: '2025-06-30'
  par30_dpd_threshold: 30
  par90_dpd_threshold: 90

# Suggested layering. Fellows: build staging → intermediate → marts.
# This is a starting structure, not a constraint — justify any deviation.
models:
  lendwell:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table
      +schema: marts
