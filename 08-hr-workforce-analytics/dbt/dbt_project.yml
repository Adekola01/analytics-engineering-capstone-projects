name: peoplecore
version: "1.0.0"
config-version: 2

profile: peoplecore

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

# The book is observed as at a single reporting date. All tenure/attrition
# maths is relative to this date, and the trailing attrition window.
vars:
  as_of_date: '2025-12-31'
  attrition_window_start: '2025-01-01'

# Suggested layering. Fellows: build staging → intermediate → marts.
# This is a starting structure, not a constraint — justify any deviation.
# The workforce mart should land at PERSON grain; the record-stitching
# (transfers + rehires) belongs in the intermediate layer, not staging.
models:
  peoplecore:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table
      +schema: marts
