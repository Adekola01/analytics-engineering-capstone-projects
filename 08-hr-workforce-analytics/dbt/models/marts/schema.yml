version: 2

models:
  - name: fct_workforce
    description: >
      One row per PERSON_ID. THE single mart both Talent and Finance pull
      their number from. See docs/business_metric_definitions.md for the
      written contract on every column, especially the three tenure
      definitions.
    columns:
      - name: person_id
        tests:
          - unique
          - not_null
      - name: tenure_time_in_seat_days
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true

  - name: fct_department_workforce
    description: "One row per department plus one 'ALL' row. Headcount/attrition/tenure with transfers correctly attributed, never counted as exits."
    columns:
      - name: department_name
        tests:
          - unique
          - not_null

  - name: fct_attrition_tenure_reconciliation_bridge
    description: >
      Single row. Walks Finance's naive record-based attrition to Talent's
      person-based attrition through two named, subtracted adjustments, and
      lays the three tenure definitions side by side. The artifact for the
      CPO/board conversation.
    columns:
      - name: window_start
        tests:
          - not_null
